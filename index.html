<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b3b4a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Torneio de Beach Tennis</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎾</text></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Se algo der errado antes do app desenhar a tela, mostra o motivo em vez de uma tela branca.
      (function () {
        function mostrar(msg) {
          var r = document.getElementById('root');
          if (!r || r.childNodes.length) return;
          r.innerHTML =
            '<div style="font-family:system-ui,sans-serif;padding:24px;line-height:1.4">' +
            '<h2 style="margin:0 0 8px">Não foi possível abrir o app</h2>' +
            '<p style="margin:0 0 12px">Tente recarregar a página. Se continuar, mande um print desta tela.</p>' +
            '<pre style="white-space:pre-wrap;font-size:12px;background:#f2f2f2;padding:12px;border-radius:8px"></pre></div>';
          r.querySelector('pre').textContent = msg + '\n' + navigator.userAgent;
        }
        window.addEventListener('error', function (e) {
          mostrar('Erro: ' + (e.message || (e.target && (e.target.src || e.target.href)) || 'desconhecido'));
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          mostrar('Erro: ' + (e.reason && (e.reason.message || e.reason)));
        });
        setTimeout(function () { mostrar('O app não carregou em 10 segundos.'); }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
